[project]
name = "jb_core_app"
authors = [
    { name = "JB Grocers LLP", email = "sachingoel24@gmail.com"}
    ]
    description = "JB Core App - Phase R shared server and client script estate for jh"
    requires-python = ">=3.10"
    readme = "README.md"
    dynamic = ["version"]
    dependencies = [
        # "frappe~=16.0.0" # Installed and managed by bench.
        ]

        [build-system]
        requires = ["flit_core >=3.4,<4"]
        build-backend = "flit_core.buildapi"

        # Frappe Cloud reads this to pick a compatible bench for the app. Without it
        # the app is not offered for installation at all.
        [tool.bench.frappe-dependencies]
        frappe = ">=16.0.0,<17.0.0"
        erpnext = ">=16.0.0,<17.0.0"

        # These dependencies are only installed when developer mode is enabled
        [tool.bench.dev-dependencies]
        # package_name = "~=1.1.0"
        
